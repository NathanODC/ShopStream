[project]
name = "shopstream"
version = "0.1.0"
description = "Code from a retail comp called ShopStream"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker==40.44.0",
    "flask>=3.1.1",
    "functions-framework>=3.9.1",
    "google-cloud-pubsub>=2.31.0",
    "google-cloud-storage>=3.2.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "isort>=6.0.1",
    "pre-commit>=4.2.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.12.5",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
