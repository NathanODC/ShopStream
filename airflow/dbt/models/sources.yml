version: 2

# Freshness uses load time, not business event time: the generator emits events
# around a fixed base date, while `dt` (GCS publish-date partition) and
# `ingestion_time` (Dataflow write time) reflect when data actually landed.
# Thresholds match the weekly dbt schedule; tighten them once ingestion is
# continuous.

sources:
  - name: batch_bronze
    schema: shopstream_bronze
    config:
      loaded_at_field: "cast(dt as timestamp)"
      freshness:
        warn_after: {count: 7, period: day}
        error_after: {count: 14, period: day}
    tables:
      - name: customer_support_tickets
        data_tests:
          - min_row_count:
              arguments:
                min_rows: 1
          - expression_is_true:
              arguments:
                expression: "sentiment_score between -1 and 1"
          - expression_is_true:
              arguments:
                expression: "satisfaction_score between 1 and 5"
          - expression_is_true:
              arguments:
                expression: "resolution_time_hours >= 0"
        columns:
          - name: ticket_id
            data_tests: [not_null]
          - name: user_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('d_customers')
                    field: user_id
                  config:
                    severity: warn
                    tags: ["silver"]
          - name: created_at
            data_tests: [not_null]
          - name: category
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["delivery", "payment", "product", "return"]
          - name: priority
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["low", "medium", "high"]
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["open", "in_progress", "resolved"]

      - name: product_catalog
        data_tests:
          - min_row_count:
              arguments:
                min_rows: 1
        columns:
          - name: product_id
            data_tests: [not_null]

  - name: streaming_bronze
    schema: "{% if target.type == 'duckdb' %}shopstream_bronze{% else %}shopstream_streaming{% endif %}"
    config:
      loaded_at_field: ingestion_time
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: clickstream_events
        identifier: "{% if target.type == 'duckdb' %}clickstream_events{% else %}clickstream_raw{% endif %}"
        data_tests:
          - min_row_count:
              arguments:
                min_rows: 1
        columns:
          - name: message_id
            data_tests: [not_null]
          - name: ingestion_time
            data_tests: [not_null]
      - name: sales_transactions
        identifier: "{% if target.type == 'duckdb' %}sales_transactions{% else %}sales_transactions_raw{% endif %}"
        data_tests:
          - min_row_count:
              arguments:
                min_rows: 1
        columns:
          - name: message_id
            data_tests: [not_null]
          - name: ingestion_time
            data_tests: [not_null]
